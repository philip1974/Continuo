name: E2E

# Electron + node-pty + Playwright 在 PR 上跑成本高、稳定性差。
# 仅手动触发(workflow_dispatch)。原每日 nightly schedule 已移除
# (长期失败、噪声大)。等 M5 拆出 smoke 分层后,再考虑把 smoke 子集挪到 PR 必要门禁。
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Electron E2E
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # 见 ci.yml 同款步骤:把 ContinuoTerminal clone 到 workspace 同级路径,供 pnpm workspace 解析。
      - name: Checkout ContinuoTerminal (workspace sibling)
        run: git clone --depth 1 https://github.com/philip1974/ContinuoTerminal.git "${{ github.workspace }}/../ContinuoTerminal"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rebuild native modules for Electron
        run: pnpm rebuild:native

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Build Electron app
        run: pnpm build

      - name: Run e2e
        run: pnpm e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

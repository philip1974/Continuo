name: CI

on:
  pull_request:
  push:
    # 只在打 tag 时跑(发布门禁),平时分支 push 不触发,省 Actions minutes。
    # 本地 `pnpm lint && pnpm typecheck && pnpm test` 是开发时的主信号。
    # 需要按需手动跑用 workflow_dispatch。
    tags:
      - '*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm workspace 依赖同级仓 philip1974/ContinuoTerminal(public)的 @continuo-terminal/* 包。
      # CI runner 默认只 checkout 本仓,需把 ContinuoTerminal clone 到 $GITHUB_WORKSPACE 的同级路径,
      # 否则 `pnpm install` 会 ENOENT(.../ContinuoTerminal/packages/host)。
      - name: Checkout ContinuoTerminal (workspace sibling)
        run: git clone --depth 1 https://github.com/philip1974/ContinuoTerminal.git "${{ github.workspace }}/../ContinuoTerminal"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm workspace 依赖同级仓 philip1974/ContinuoTerminal(public)的 @continuo-terminal/* 包。
      # CI runner 默认只 checkout 本仓,需把 ContinuoTerminal clone 到 $GITHUB_WORKSPACE 的同级路径,
      # 否则 `pnpm install` 会 ENOENT(.../ContinuoTerminal/packages/host)。
      - name: Checkout ContinuoTerminal (workspace sibling)
        run: git clone --depth 1 https://github.com/philip1974/ContinuoTerminal.git "${{ github.workspace }}/../ContinuoTerminal"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

  test:
    name: Test (vitest, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # pnpm workspace 依赖同级仓 philip1974/ContinuoTerminal(public)的 @continuo-terminal/* 包。
      # CI runner 默认只 checkout 本仓,需把 ContinuoTerminal clone 到 $GITHUB_WORKSPACE 的同级路径,
      # 否则 `pnpm install` 会 ENOENT(.../ContinuoTerminal/packages/host)。
      - name: Checkout ContinuoTerminal (workspace sibling)
        run: git clone --depth 1 https://github.com/philip1974/ContinuoTerminal.git "${{ github.workspace }}/../ContinuoTerminal"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rebuild native modules for Electron
        run: pnpm rebuild:native

      - name: Run unit tests
        if: matrix.os != 'windows-latest'
        # TODO: re-enable electron-main-dependent Vitest specs in CI after
        # Electron binary installation is fixed for Actions. They still run
        # locally; Electron coverage also remains in e2e.
        run: pnpm test:unit

      - name: Run unit tests (Windows stable workers)
        if: matrix.os == 'windows-latest'
        # Windows runners have intermittently crashed Vitest child-process workers
        # with "Worker exited unexpectedly" even after all tests passed.
        run: pnpm exec vitest run --project unit --pool=threads --poolOptions.threads.singleThread --no-file-parallelism

      - name: Run contract tests
        run: pnpm test:contract

      - name: Run integration tests
        run: pnpm test:integration

  debug-spike:
    name: Debug spike (DAP)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # pnpm workspace 依赖同级仓 philip1974/ContinuoTerminal(public)的 @continuo-terminal/* 包。
      # CI runner 默认只 checkout 本仓,需把 ContinuoTerminal clone 到 $GITHUB_WORKSPACE 的同级路径。
      - name: Checkout ContinuoTerminal (workspace sibling)
        run: git clone --depth 1 https://github.com/philip1974/ContinuoTerminal.git "${{ github.workspace }}/../ContinuoTerminal"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build debug spike fixture
        run: pnpm exec tsc -p scripts/debug-spike/tsconfig.json

      # Fetches pinned vscode-js-debug DAP release v1.117.0 (~4MB), then verifies its pinned sha256.
      - name: Fetch pinned js-debug DAP adapter
        run: node scripts/debug-spike/fetch-adapter.mjs

      - name: Assert js-debug DAP adapter exists
        run: test -f scripts/debug-spike/.adapter/js-debug/src/dapDebugServer.js

      - name: Run debug spike specs without adapter skip
        run: pnpm exec vitest run --project unit src/__tests__/49-agent-controllable-debug --reporter=verbose

      - name: Run electron main-context DAP teardown spec without adapter skip
        run: pnpm exec vitest run --project electron electron/main/__tests__/dap-teardown-mini.spec.ts --reporter=verbose

  perf-bench:
    name: Plugin DataStore perf bench
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      # pnpm workspace 依赖同级仓 philip1974/ContinuoTerminal(public)的 @continuo-terminal/* 包。
      # CI runner 默认只 checkout 本仓,需把 ContinuoTerminal clone 到 $GITHUB_WORKSPACE 的同级路径,
      # 否则 `pnpm install` 会 ENOENT(.../ContinuoTerminal/packages/host)。
      - name: Checkout ContinuoTerminal (workspace sibling)
        run: git clone --depth 1 https://github.com/philip1974/ContinuoTerminal.git "${{ github.workspace }}/../ContinuoTerminal"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Run T5 perf bench
        env:
          RUN_PERF: '1'
        run: pnpm exec vitest run --project electron electron/main/__tests__/plugin-data-store.perf.bench.ts --reporter=verbose

# sync-design check 不在 CI 跑:依赖跨仓 checkout philip1974/Nous(private),
# 默认 GITHUB_TOKEN 没权限。设计层漂移由本地 `pnpm sync:design:check` 守护
# (commit 前由开发者主动跑;freeze-design-system.md 也列入必跑命令)。
# 未来若想纳入 CI,在 repo Secrets 加 NOUS_PAT,再恢复 sync-design job。

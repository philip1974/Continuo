# 单包仓库。此文件只为让各 pnpm 版本都放行原生依赖的安装脚本:
# - pnpm 9 读 package.json 的 "pnpm.onlyBuiltDependencies",但要求本文件有 packages 字段;
# - pnpm 10 读这里的 onlyBuiltDependencies;
# - pnpm 11+ 不再读 package.json 的 "pnpm" 字段,改读这里的 allowBuilds。
# overrides 同理:pnpm 9 读 package.json 的 pnpm.overrides,pnpm 10+ 读这里;两处须保持一致。
packages:
  - .
onlyBuiltDependencies:
  - electron
  - electron-builder
  - electron-winstaller
  - esbuild
  - node-pty
allowBuilds:
  electron: true
  electron-builder: true
  electron-winstaller: true
  esbuild: true
  node-pty: true
# 供应链策略:只解析发布超过 24 小时的版本(与 pnpm 11+ 默认一致;pnpm 10 亦读取此项)。
minimumReleaseAge: 1440
overrides:
  tinypool@<2.1.2: ^2.1.2
  'esbuild@>=0.27.3 <0.28.1': '>=0.28.1'
  'js-yaml@>=4 <4.3.2': ^4.3.2
  'brace-expansion@>=1 <1.1.21': ^1.1.21
  'brace-expansion@>=2 <2.1.7': ^2.1.7
  'brace-expansion@>=4 <5.0.12': ^5.0.12
  'undici@>=7 <7.30.1': ^7.30.1
  # node-pty 1.1.0 在 macOS 每关一个终端漏 1 ptmx 主端 + 1 从端 + 1 kqueue(posix_spawn 后父进程不 close(slave)),
  # 1.2.0-beta.18 修复;sibling server-node 声明 ^1.1.0(prerelease 不满足),须覆盖成同一份,主进程与测试才加载同一个
  # native 模块。见 src/__tests__/terminal-pty-fd-leak。升到含该修复的正式版后与 package.json 依赖一并改回 ^。
  node-pty: 1.2.0-beta.18
